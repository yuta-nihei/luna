[package]
name = "luna"
version = "0.0.1"
description = "Luna Editor"
authors = ["Luna"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
url = "2"

[profile.release]
# Luna targets small, fast binaries (CLAUDE.md performance goals).
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
